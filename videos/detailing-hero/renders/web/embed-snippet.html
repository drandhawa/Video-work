<!-- Hero background video: desktop gets 16:9, phones get 9:16. Muted + playsinline are required for autoplay. -->
<section class="hero">
  <video class="hero-video" autoplay muted loop playsinline preload="auto"
         poster="hero-16x9-poster.jpg">
    <source src="hero-9x16.webm" type="video/webm" media="(max-aspect-ratio: 3/4)">
    <source src="hero-9x16.mp4"  type="video/mp4"  media="(max-aspect-ratio: 3/4)">
    <source src="hero-16x9.webm" type="video/webm">
    <source src="hero-16x9.mp4"  type="video/mp4">
  </video>
  <div class="hero-content">
    <!-- Your headline and booking button go here -->
  </div>
</section>
<style>
  .hero { position: relative; min-height: 100vh; overflow: hidden; background: #050607; }
  .hero-video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  .hero-content { position: relative; z-index: 1; }
  @media (prefers-reduced-motion: reduce) { .hero-video { display: none; } }
</style>
